[package]
name = "etagere"
description = "Dynamic 2D texture atlas allocation using the shelf packing algorithm."
version = "0.3.0"
authors = ["Nicolas Silva <nical@fastmail.com>"]
repository = "https://github.com/nical/etagere"
documentation = "https://docs.rs/etagere/"
edition = "2018"
license = "MIT OR Apache-2.0"
keywords = ["2d"]
exclude = [".backup*"]

[dependencies]
euclid = { version = "0.22.14", default-features = false }
svg_fmt = { version = "0.4.5", optional = true }
serde = { version = "1.0", optional = true }

[features]
std = ["svg_fmt"]
ffi = []
serialization = ["serde", "euclid/serde"]
checks = []

[workspace]
members = ["cli"]

# Uncomment this when profiling.
[profile.release]
debug = true
